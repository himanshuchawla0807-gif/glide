name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: zsh build.sh
      - run: zsh test.sh
      - run: codesign --verify --deep --strict dist/Glide.app

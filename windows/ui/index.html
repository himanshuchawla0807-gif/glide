<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Glide</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="panel" class="panel">
      <div class="slats" aria-hidden="true"></div>
      <header>
        <span class="brand">glide<span class="dot">.</span></span>
        <div class="tools">
          <span id="connection" class="connection">Chrome</span
          ><button id="settingsButton" title="Settings" aria-label="Settings">
            ⚙</button
          ><button id="close" title="Dismiss" aria-label="Dismiss">×</button>
        </div>
      </header>
      <section id="search">
        <div class="input-row">
          <div class="orb" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="typing">
            <input
              id="query"
              aria-label="Search or enter a URL"
              placeholder="Search anything"
              autocomplete="off"
              spellcheck="true"
              maxlength="2000"
            /><span id="typeLight" aria-hidden="true"></span>
          </div>
        </div>
        <div id="results" role="listbox" aria-label="Suggestions"></div>
      </section>
      <section id="settings" hidden>
        <div class="intro">
          <span class="eyebrow">YOUR SHORTCUT TO THE WEB</span>
          <h1>One thought. One tab.</h1>
          <p>Connect the Chrome profile you use. Glide takes it from here.</p>
        </div>
        <div class="setting">
          <div>
            <strong>Appearance</strong><small>Make the space yours.</small>
          </div>
          <div id="themes" class="themes"></div>
        </div>
        <label class="setting"
          ><div>
            <strong>Google suggestions</strong
            ><small>Sends typed text to Google when enabled.</small>
          </div>
          <input id="google" type="checkbox" /></label
        ><label class="setting"
          ><div>
            <strong>Chrome history</strong
            ><small>Suggestions from this profile, on this device.</small>
          </div>
          <input id="history" type="checkbox" /></label
        ><label class="setting profile"
          ><div>
            <strong>Chrome profile folder</strong
            ><small>From chrome://version → Profile Path.</small>
          </div>
          <input
            id="profile"
            value="Default"
            aria-label="Chrome profile folder"
        /></label>
        <div class="pairing">
          <p id="pairText">
            Load the companion in your chosen Chrome profile, then click its
            toolbar icon.
          </p>
          <div class="actions">
            <button id="folder">Show companion</button
            ><button id="pair" class="primary" disabled>Approve profile</button
            ><button id="disconnect" hidden>Disconnect</button>
          </div>
        </div>
        <footer>
          <span>Local connection. No Glide account or analytics.</span
          ><button id="back">Back to search ↗</button>
        </footer>
      </section>
      <div id="notice" role="status" hidden></div>
      <div id="launchVeil" aria-hidden="true"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
